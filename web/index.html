<!doctype html>
<html lang="zh-CN" data-theme="u1s1-official">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const THEME_KEY = "u1s12api.admin.theme.v2"
        const MODE_KEY = "u1s12api.admin.mode"
        const LEGACY_KEY = "u1s12api.admin.theme"
        const THEMES = [
          "u1s1-official", "porcelain-moss", "tungsten-dark", "neo-brutalism",
          "apple-glass", "clear-glass", "paper-ink", "terminal",
        ]
        let theme = "u1s1-official"
        let mode = "system"
        try {
          const storedTheme = localStorage.getItem(THEME_KEY) || localStorage.getItem(LEGACY_KEY)
          if (storedTheme && THEMES.includes(storedTheme)) theme = storedTheme
          const storedMode = localStorage.getItem(MODE_KEY)
          if (storedMode === "light" || storedMode === "dark" || storedMode === "system") mode = storedMode
        } catch {}
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches
        const dark = mode === "system" ? prefersDark : mode === "dark"
        const root = document.documentElement
        root.dataset.theme = theme
        root.dataset.mode = dark ? "dark" : "light"
        root.classList.toggle("dark", dark)
        root.style.colorScheme = dark ? "dark" : "light"
      })()
    </script>
    <link rel="icon" href="/admin/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>U1S12API 管理后台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
